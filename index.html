<title>Demo bancaria</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #fff;
  overflow-x: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.screen {
  position: relative;
  width: 100%;
  max-width: 853px;
  margin: 0 auto;
  line-height: 0;
}

.base-image {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}

.login-input { display: none; }

.login-input::placeholder {
  color: #b5b5b5;
  opacity: 1;
}

.person-icon { display: none; }

.continue-btn {
  position: absolute;
  left: 5%;
  top: 38.05%;
  width: 90%;
  height: 4.75%;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  z-index: 20;
}



.hint {
  position: absolute;
  left: 5%;
  top: 44.55%;
  width: 90%;
  text-align: center;
  color: transparent;
  font-size: 14px;
}

#second {
  display: none;
  scroll-margin-top: 0;
}

/* Cambio de pantalla sin depender de JavaScript */
#second:target {
  display: block !important;
}

body:has(#second:target) #login {
  display: none !important;
}

#login[hidden], #second[hidden] {
  display: none !important;
}

#second .bottom-nav {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  z-index: 3;
}

.message {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: max-content;
  max-width: 90%;
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(0,0,0,.78);
  color: #fff;
  font-size: 14px;
  line-height: 1.3;
  display: none;
  z-index: 20;
}
</style>
</head>
