<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Demo de navegación</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000}
body{overflow:hidden;font-family:Arial,sans-serif}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.screen img{width:100%;height:100%;object-fit:contain;display:block}
#second{display:none}
.demo{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  z-index:10;background:#c00;color:#fff;padding:7px 12px;
  border-radius:6px;font-size:12px;font-weight:700;letter-spacing:.3px;
}
.continue{
  position:fixed;left:8%;bottom:28px;width:84%;z-index:11;
  min-height:50px;border:0;border-radius:7px;background:#176fa8;
  color:#fff;font-size:18px;font-weight:700;cursor:pointer;
  box-shadow:0 3px 12px #0008;
}
.continue:active{transform:scale(.98)}
</style>
</head>
<body>

<div class="demo">DEMO — NO REAL / NO ENVÍA DATOS</div>

<section id="first" class="screen">
  <img src="pantalla-1.jpeg" alt="Captura de demostración 1">
</section>

<section id="second" class="screen">
  <img src="pantalla-2.jpeg" alt="Captura de demostración 2">
</section>

<button id="continueBtn" class="continue" type="button">CONTINUAR</button>

<script>
const first = document.getElementById("first");
const second = document.getElementById("second");
const button = document.getElementById("continueBtn");

button.addEventListener("click", () => {
  first.style.display = "none";
  second.style.display = "flex";
  button.style.display = "none";
});
</script>
</body>
</html>
