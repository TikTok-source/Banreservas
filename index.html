<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Prototipo de navegación</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000}
body{overflow:hidden;font-family:Arial,sans-serif}
.screen{position:absolute;inset:0;display:none;background:#000}
.screen.active{display:flex;align-items:center;justify-content:center}
.screen img{width:100%;height:100%;object-fit:contain;display:block}
.demo{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;background:#b00000;color:#fff;padding:6px 10px;border-radius:5px;font-size:11px;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;height:92px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid #ddd}
.nav button{border:0;background:transparent;color:#59616a;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.nav button.active{color:#079bd8;font-weight:700}
.icon{font-size:27px;line-height:1}
.continue{position:fixed;left:8%;bottom:110px;width:84%;z-index:15;min-height:50px;border:0;border-radius:7px;background:#176fa8;color:#fff;font-size:18px;font-weight:700}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="demo">PROTOTIPO — NO REAL</div>

<section id="login" class="screen active"><img src="pantalla1.jpeg" alt="Pantalla inicial"></section>
<section id="inicio" class="screen"><img src="inicio.jpeg" alt="Inicio"></section>
<section id="transacciones" class="screen"><img src="transacciones.jpeg" alt="Transacciones"></section>
<section id="mas" class="screen"><img src="mas.jpeg" alt="Más opciones"></section>

<button id="continueBtn" class="continue" type="button">CONTINUAR</button>

<nav class="nav" aria-label="Navegación del prototipo">
  <button type="button" data-screen="inicio"><span class="icon">⌂</span><span>Inicio</span></button>
  <button type="button" data-screen="transacciones"><span class="icon">⇄</span><span>Transacciones</span></button>
  <button type="button" data-screen="solicitudes"><span class="icon">⊕</span><span>Solicitudes</span></button>
  <button type="button" data-screen="mas"><span class="icon">◉</span><span>Más</span></button>
</nav>

<script>
const screens=document.querySelectorAll('.screen');
const buttons=document.querySelectorAll('.nav button');
const continueBtn=document.getElementById('continueBtn');

function show(id){
  if(id==='solicitudes'){
    alert('Solicitudes todavía no tiene una imagen asignada.');
    return;
  }
  screens.forEach(s=>s.classList.toggle('active',s.id===id));
  buttons.forEach(b=>b.classList.toggle('active',b.dataset.screen===id));
  continueBtn.classList.toggle('hidden',id!=='login');
}
continueBtn.addEventListener('click',()=>show('inicio'));
buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.screen)));
</script>
</body>
</html>
